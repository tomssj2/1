<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Funky Cow — Business Card</title>
<link rel="stylesheet" href="print.css">
<style>
  /*
    Standard EU card: 85 × 55 mm trim, plus 3 mm bleed on every side = 91 × 61 mm pages.
    Keep text inside the 4 mm safe zone (7 mm from the page edge).
    ?sheet → 10 cards per A4 page with cut marks, for printing at home (page 1 fronts, page 2 backs).
  */
  :root { --bleed: 3mm; --w: 85mm; --h: 55mm; }
  @page { size: 91mm 61mm; margin: 0; }

  .card {
    width: calc(var(--w) + 2 * var(--bleed));
    height: calc(var(--h) + 2 * var(--bleed));
    position: relative;
    overflow: hidden;
    page-break-after: always;
    break-after: page;
  }

  /* ---------- Front ---------- */
  .front { display: flex; align-items: center; gap: 5mm; padding: 0 10mm 0 9mm; color: var(--cream); }
  .front .badge {
    width: 37mm; height: 37mm; flex: none; border-radius: 50%;
    background: var(--cream);
    border: 1.3mm solid var(--white);
    box-shadow: 0 0 0 .9mm var(--turq), 1.1mm 1.1mm 0 .9mm rgba(0,0,0,.25);
    display: grid; place-items: center;
  }
  .front .badge img { width: 97%; }
  .front .copy { flex: 1; }
  .front .copy .display { font-size: 21pt; line-height: .92; text-shadow: .5mm .5mm 0 var(--ink), 1mm 1mm 0 var(--red-deep); }
  .front .copy .display em { color: var(--white); }
  .front .copy .pill {
    display: inline-block; margin-top: 2.6mm;
    background: var(--turq); color: var(--white);
    font-size: 5.6pt; font-weight: 700; letter-spacing: 1pt; text-transform: uppercase;
    padding: .8mm 2.2mm; border-radius: 5mm; box-shadow: .4mm .4mm 0 var(--ink);
  }
  .front .checker-strip {
    position: absolute; left: 0; right: 0; bottom: 0; height: 6mm;  /* 3 mm visible after trim */
    background-size: 3mm 3mm; background-position: 0 0, 1.5mm 1.5mm;
  }

  /* ---------- Back ---------- */
  .back { background: var(--cream); display: flex; align-items: center; gap: 5mm; padding: 9mm 8mm 7mm 8mm; }
  .back .checker-strip {
    position: absolute; left: 0; right: 0; top: 0; height: 6mm;
    background-size: 3mm 3mm; background-position: 0 0, 1.5mm 1.5mm;
    border-bottom: .8mm solid var(--turq);
  }
  .back .red-rule { position: absolute; left: 0; right: 0; bottom: 0; height: 5.5mm; background: var(--red); }
  .back .copy { flex: 1; min-width: 0; }
  .back .brand { font-size: 18pt; color: var(--red); line-height: 1.1; }
  .back .tagline { font-family: var(--font-display); font-weight: 700; font-size: 6.6pt; letter-spacing: 2pt; color: var(--turq-dark); text-transform: uppercase; }
  .back .lines { margin-top: 2.4mm; padding-top: 2.2mm; border-top: .35mm dotted var(--red); display: grid; gap: 1.1mm; }
  .back .line { display: flex; gap: 1.8mm; align-items: flex-start; font-size: 6.6pt; line-height: 1.3; }
  .back .line svg { width: 2.8mm; height: 2.8mm; flex: none; margin-top: .2mm; fill: var(--red); }
  .back .line strong { font-weight: 700; }
  .back .line .sub { color: var(--muted); }
  .back .qr { flex: none; text-align: center; }
  .back .qr img { width: 20mm; height: 20mm; background: var(--white); padding: 1.3mm; border-radius: 1.4mm; border: .4mm solid var(--turq); display: block; }
  .back .qr span { display: block; margin-top: 1mm; font-family: var(--font-display); font-weight: 700; font-size: 6pt; letter-spacing: .8pt; text-transform: uppercase; color: var(--turq-dark); }

  /* ---------- A4 sheet mode ---------- */
  body.sheet { width: 210mm; }
  body.sheet .page {
    width: 210mm; height: 297mm; position: relative;
    page-break-after: always; break-after: page;
  }
  body.sheet .page .card { position: absolute; page-break-after: auto; break-after: auto; }
  body.sheet .mark { position: absolute; background: var(--ink); }
</style>
</head>
<body>

<template id="front">
  <section class="card front stripes">
    <div class="badge"><img src="../assets/logo.png" alt="Funky Cow"></div>
    <div class="copy">
      <div class="display">Smash.<br>Shake.<br><em>Repeat.</em></div>
      <span class="pill">Family-owned diner · Νάουσα</span>
    </div>
    <div class="checker checker-strip"></div>
  </section>
</template>

<template id="back">
  <section class="card back">
    <div class="checker checker-strip"></div>
    <div class="copy">
      <div class="script brand">Funky Cow</div>
      <div class="tagline">Smash burgers ★ Milkshakes</div>
      <div class="lines">
        <div class="line">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
          <div><strong>Πλατεία Καρατάσου 4, Νάουσα</strong><br><span class="sub">Karatasou Square 4, Naousa</span></div>
        </div>
        <div class="line">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 6h-3a15.7 15.7 0 0 0-1.4-3.9A8 8 0 0 1 18.9 8zM12 4c.8 1.2 1.5 2.5 1.9 4h-3.8c.4-1.5 1.1-2.8 1.9-4zM4.3 14a8.2 8.2 0 0 1 0-4h3.4a16.5 16.5 0 0 0 0 4H4.3zm.8 2h3a15.7 15.7 0 0 0 1.4 3.9A8 8 0 0 1 5.1 16zm3-8h-3a8 8 0 0 1 4.4-3.9C7.9 5.3 7.4 6.6 8.1 8zM12 20c-.8-1.2-1.5-2.5-1.9-4h3.8c-.4 1.5-1.1 2.8-1.9 4zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4zm.2 5.9c.6-1.2 1.1-2.5 1.4-3.9h3a8 8 0 0 1-4.4 3.9zM16.3 14a16.5 16.5 0 0 0 0-4h3.4a8.2 8.2 0 0 1 0 4h-3.4z"/></svg>
          <div><strong>tomssj2.github.io/1</strong></div>
        </div>
      </div>
    </div>
    <div class="qr">
      <img src="qr-website.svg" alt="QR code to the Funky Cow website">
      <span>Scan for menu</span>
    </div>
    <div class="red-rule"></div>
  </section>
</template>

<script>
  const front = document.getElementById("front").content;
  const back = document.getElementById("back").content;

  if (!new URLSearchParams(location.search).has("sheet")) {
    // Single card with bleed: page 1 front, page 2 back.
    document.body.append(front.cloneNode(true), back.cloneNode(true));
  } else {
    // 2 × 5 trimmed cards per A4 page, with cut marks. Backs mirror left↔right for duplex printing.
    document.body.classList.add("sheet");
    const style = document.createElement("style");
    style.textContent = "@page { size: 210mm 297mm; margin: 0; }";
    document.head.append(style);

    const W = 85, H = 55, cols = 2, rows = 5;
    const x0 = (210 - cols * W) / 2, y0 = (297 - rows * H) / 2;

    [front, back].forEach((tpl, side) => {
      const page = document.createElement("div");
      page.className = "page";
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const col = side ? cols - 1 - c : c;
          const card = tpl.cloneNode(true).firstElementChild;
          // Trim the 3 mm bleed with a clipping wrapper.
          const wrap = document.createElement("div");
          Object.assign(wrap.style, {
            position: "absolute", overflow: "hidden",
            left: x0 + col * W + "mm", top: y0 + r * H + "mm", width: W + "mm", height: H + "mm",
          });
          Object.assign(card.style, { left: "-3mm", top: "-3mm" });
          wrap.append(card);
          page.append(wrap);
        }
      }
      // Cut marks outside the grid.
      const mark = (l, t, w, h) => {
        const m = document.createElement("div");
        m.className = "mark";
        Object.assign(m.style, { left: l + "mm", top: t + "mm", width: w + "mm", height: h + "mm" });
        page.append(m);
      };
      for (let c = 0; c <= cols; c++) {
        const x = x0 + c * W;
        mark(x - 0.1, y0 - 8, 0.2, 5);
        mark(x - 0.1, y0 + rows * H + 3, 0.2, 5);
      }
      for (let r = 0; r <= rows; r++) {
        const y = y0 + r * H;
        mark(x0 - 8, y - 0.1, 5, 0.2);
        mark(x0 + cols * W + 3, y - 0.1, 5, 0.2);
      }
      document.body.append(page);
    });
  }
</script>
</body>
</html>
